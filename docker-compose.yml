services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techsupport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techsupport}
      POSTGRES_DB: ${POSTGRES_DB:-techsupport}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-techsupport} -d $${POSTGRES_DB:-techsupport}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techsupport}:${POSTGRES_PASSWORD:-techsupport}@db:5432/${POSTGRES_DB:-techsupport}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
